name = "sma-cron"
main = "worker.js"
compatibility_date = "2024-10-01"

# UTC 기준 cron
#   0 2 * * 2-6 → KST 11:00 화~토 (daily.yml)
#   30 2 * * 6  → KST 11:30 토    (weekly.yml)
[triggers]
crons = ["0 2 * * 2-6", "30 2 * * 6"]

[vars]
OWNER = "z66g"
REPO = "sma"
REF = "main"

# Secrets (wrangler secret put GH_PAT, MANUAL_KEY)
#   GH_PAT       — GitHub Classic PAT with repo + workflow scope
#   MANUAL_KEY   — (optional) shared secret for manual /daily, /weekly dispatch
