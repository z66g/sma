name = "sma-cron"
main = "worker.js"
compatibility_date = "2024-10-01"

# 단일 cron trigger (계정 한도 5개 절약) — 워커 내부에서 분기
#   02:00 / 02:30 UTC 화~토 = KST 11:00 / 11:30 화~토
#   - minute 0 → daily.yml
#   - minute 30 & day-of-week 6(토) → weekly.yml
#   - minute 30 & 그 외 요일 → skip
[triggers]
crons = ["0,30 2 * * 2-6"]

[vars]
OWNER = "z66g"
REPO = "sma"
REF = "main"

# Secrets (wrangler secret put GH_PAT, MANUAL_KEY)
#   GH_PAT       — GitHub Classic PAT with repo + workflow scope
#   MANUAL_KEY   — (optional) shared secret for manual /daily, /weekly dispatch
