name = "sma-cron"
main = "worker.js"
compatibility_date = "2024-10-01"

# 단일 cron trigger (계정 한도 5개 절약) — 워커 내부에서 분기
#   02:00 UTC 화~토 = KST 11:00 → daily-analysis.yml (분석 세션 = ET 전날이 NYSE 휴장일이면 skip)
#   주간 AI 내러티브는 Claude Code 예약 작업(토 KST 12:23)이 생성하므로 여기서 dispatch 하지 않는다.
[triggers]
crons = ["0 2 * * 2-6"]

[vars]
OWNER = "z66g"
REPO = "sma"
REF = "main"

# Secrets (wrangler secret put GH_PAT, MANUAL_KEY)
#   GH_PAT       — Fine-grained PAT (z66g/sma only, Actions: Read and write)
#   MANUAL_KEY   — shared secret for manual POST /daily, /weekly (header X-Manual-Key).
#                  미설정 시 수동 dispatch 는 503 으로 거부됨.
