<style>

  .wrap { max-width:1400px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #D0D7DE; padding-bottom:12px; margin-bottom:16px; flex-wrap:wrap; gap:12px; }
  h1 { font-size:20px; margin:0; }
  .meta { color:#656D76; font-size:11px; }
  .controls { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  input, select { padding:6px 10px; border:0.5px solid #D0D7DE; border-radius:4px; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:13px; background:#FFFFFF; color:#1F2328; }
  input { min-width:220px; }
  .stat-bar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .stat { background:#F6F8FA; border:0.5px solid #D0D7DE; border-radius:6px; padding:8px 14px; min-width:120px; }
  .stat-label { font-size:10px; color:#656D76; text-transform:uppercase; letter-spacing:0.05em; }
  .stat-value { font-size:18px; font-weight:600; }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th,td { border:0.5px solid #D0D7DE; padding:6px 8px; text-align:left; white-space:nowrap; }
  th { background:#EAEEF2; color:#656D76; font-weight:600; cursor:pointer; user-select:none; position:sticky; top:0; }
  th:hover { background:#DDE3E8; }
  tr:nth-child(even) { background:#F6F8FA; }
  tr:hover { background:#DDF4FF; }
  a { color:#0969DA; text-decoration:none; }
  a:hover { text-decoration:underline; }
  .pill { padding:1px 8px; border-radius:10px; font-size:10px; font-weight:600; }
  .pill-A { background:#DAFBE1; color:#1A7F5A; }
  .pill-B { background:#FFF8C5; color:#9A6700; }
  .pill-C { background:#FFEBE9; color:#CF222B; }
  .pattern { font-size:9px; background:#FFF8C5; color:#9A6700; padding:1px 4px; border-radius:6px; margin-right:2px; }
  .tbl-wrap { max-height:70vh; overflow:auto; border:0.5px solid #D0D7DE; border-radius:6px; }
  .empty { padding:32px; text-align:center; color:#656D76; }
</style>
</head>

    <option value="LOW_CTB_PARADOX">LOW_CTB_PARADOX</option>
  </select>
  <select id="sort">
    <option value="ticker">Ticker ↓</option>
    <option value="scenario_pct-desc">확률 높은순</option>
    <option value="raw_score-desc">Score 높은순</option>
    <option value="raw_score-asc">Score 낮은순</option>
    <option value="ctb_fee-desc">CTB 높은순</option>
    <option value="short_pct-desc">Short% 높은순</option>
  </select>
  <span id="count" style="color:#656D76;font-size:11px;"></span>
</div>

<div class="tbl-wrap">

    <th>CTB %</th>
    <th>Max Pain</th>
    <th>Patterns</th>
    <th>Reports</th>

  </tr></thead>
  <tbody id="tbody"></tbody>
</table>
</div>
