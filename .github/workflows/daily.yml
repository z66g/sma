name: Daily Smart Money Analysis

on:
  # GitHub native cron 비활성화 — cron-job.org 가 workflow_dispatch API 로
  # KST 11:00 화~토 에 외부에서 트리거 (러너 큐 지연 회피).
  # 필요 시 아래 schedule 블록 주석 해제하면 원래대로 복구.
  # schedule:
  #   - cron: "0 2 * * 2-6"
  workflow_dispatch:
    inputs:
      ticker:
        description: "단일 종목만 즉시 분석 (빈 값이면 tickers.txt 전체)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sma-daily
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analysis per ticker
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          OUT_DIR="reports/${DATE}"
          mkdir -p "${OUT_DIR}"
          export SMA_OUT_DIR="${OUT_DIR}"

          SINGLE="${{ github.event.inputs.ticker }}"
          if [ -n "${SINGLE}" ]; then
            TICKERS="$(echo ${SINGLE} | tr 'a-z' 'A-Z' | xargs)"
            echo "Single-ticker dispatch: ${TICKERS}"
          else
            TICKERS=$(grep -v '^#' tickers.txt | grep -v '^\s*$' | tr -d '\r' | xargs)
            echo "Watchlist tickers: ${TICKERS}"
          fi

          FIRST=1
          for T in ${TICKERS}; do
            if [ $FIRST -eq 0 ]; then
              echo "sleeping 15s (Polygon rate limit)..."
              sleep 15
            fi
            FIRST=0
            echo "=== Analyzing ${T} ==="
            python3 sma.py "${T}" || echo "WARN: ${T} failed, continuing"
          done

          python3 build_index.py

      - name: Commit reports
        run: |
          git config user.name  "sma-bot"
          git config user.email "sma-bot@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No new reports to commit"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "reports: ${DATE} daily analysis [skip ci]"
          git push
