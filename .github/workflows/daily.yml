name: Daily Smart Money Analysis

on:
  schedule:
    # 매일 평일 14:00 UTC = 23:00 KST (= 10:00 ET, 미장 개장 30분 후)
    # FINRA T+1이라 "오늘 UTC 날짜" = "어제 미국 거래일" 데이터 기준
    - cron: "0 14 * * 2-6"   # 화~토 (= 월~금 미국 시장 기준)
  workflow_dispatch:        # 수동 실행 허용

permissions:
  contents: write           # reports/ 커밋용

concurrency:
  group: sma-daily
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analysis per ticker
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          OUT_DIR="reports/${DATE}"
          mkdir -p "${OUT_DIR}"
          export SMA_OUT_DIR="${OUT_DIR}"

          # tickers.txt 파싱 (주석/빈줄 제외)
          TICKERS=$(grep -v '^#' tickers.txt | grep -v '^\s*$' | tr -d '\r' | xargs)
          echo "Tickers to analyze: ${TICKERS}"

          # Polygon 무료 티어 5 req/min → 티커당 15초 간격
          FIRST=1
          for T in ${TICKERS}; do
            if [ $FIRST -eq 0 ]; then
              echo "sleeping 15s (Polygon rate limit)..."
              sleep 15
            fi
            FIRST=0
            echo "=== Analyzing ${T} ==="
            python3 sma.py "${T}" || echo "WARN: ${T} failed, continuing"
          done

          # 인덱스 재생성
          python3 build_index.py

      - name: Commit reports
        run: |
          git config user.name  "sma-bot"
          git config user.email "sma-bot@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No new reports to commit"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "reports: ${DATE} daily analysis [skip ci]"
          git push
