name: Daily Smart Money Analysis

on:
  schedule:
    # 01:30 UTC 화~토 = KST 10:30 토~일.
    # FINRA 파일은 미국 장 마감 후 공개되므로 미 동부 전일 데이터를 안정적으로 얻으려면
    # 미국 After-Hours 종료(8PM ET = 00:00 UTC EDT / 01:00 UTC EST) 이후여야 함.
    # 01:30 UTC는 EDT·EST 모두 커버.
    - cron: "30 1 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sma-daily
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analysis per ticker
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          OUT_DIR="reports/${DATE}"
          mkdir -p "${OUT_DIR}"
          export SMA_OUT_DIR="${OUT_DIR}"

          TICKERS=$(grep -v '^#' tickers.txt | grep -v '^\s*$' | tr -d '\r' | xargs)
          echo "Tickers to analyze: ${TICKERS}"

          FIRST=1
          for T in ${TICKERS}; do
            if [ $FIRST -eq 0 ]; then
              echo "sleeping 15s (Polygon rate limit)..."
              sleep 15
            fi
            FIRST=0
            echo "=== Analyzing ${T} ==="
            python3 sma.py "${T}" || echo "WARN: ${T} failed, continuing"
          done

          python3 build_index.py

      - name: Commit reports
        run: |
          git config user.name  "sma-bot"
          git config user.email "sma-bot@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No new reports to commit"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "reports: ${DATE} daily analysis [skip ci]"
          git push
