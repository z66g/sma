name: Weekly AI Narrative

on:
  # GitHub native cron 비활성화 — cron-job.org 가 workflow_dispatch API 로
  # KST 11:30 토 에 외부에서 트리거 (러너 큐 지연 회피).
  # 필요 시 아래 schedule 블록 주석 해제하면 원래대로 복구.
  # schedule:
  #   - cron: "30 2 * * 6"
  workflow_dispatch:
    inputs:
      ticker:
        description: "단일 티커만 생성하려면 입력 (빈 값이면 전체)"
        required: false
        default: ""
      mode:
        description: "weekly / adhoc"
        required: false
        default: "weekly"

permissions:
  contents: write

concurrency:
  group: sma-narrative
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate narrative per ticker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set"
            exit 1
          fi

          MODE="${{ github.event.inputs.mode }}"
          [ -z "${MODE}" ] && MODE="weekly"
          SINGLE="${{ github.event.inputs.ticker }}"

          if [ -n "${SINGLE}" ]; then
            TICKERS="${SINGLE}"
          else
            TICKERS=$(grep -v '^#' tickers.txt | grep -v '^\s*$' | tr -d '\r' | xargs)
          fi
          echo "Narrating: ${TICKERS}  mode=${MODE}"

          for T in ${TICKERS}; do
            echo "=== Narrating ${T} ==="
            python3 narrative.py "${T}" --mode "${MODE}" --days 30 || echo "WARN: ${T} narrative failed"
          done

          python3 build_index.py

      # Narrative 파일을 artifact 로 업로드 (push 실패 시 수동 복구용, 7일 보관).
      # if: always() — 뒤에 Commit 단계가 실패해도 여기까진 반드시 실행.
      - name: Upload narratives as artifact (safety net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narratives-${{ github.run_id }}
          path: |
            reports/tickers/*/narratives/*.html
            reports/index.html
            reports/tickers/*/index.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit narratives
        run: |
          git config user.name  "sma-bot"
          git config user.email "sma-bot@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No new narratives to commit"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "narratives: ${DATE} weekly [skip ci]"
          # daily 워크플로우와 동시 실행될 수 있어 push 경쟁 발생 → rebase-and-retry
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push success on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed, sleeping 10s…"
            sleep 10
          done
          echo "push failed after 5 attempts"
          exit 1
