name: Weekly AI Narrative

on:
  schedule:
    # 원래 스케줄 유지 (GitHub 워크플로우 등록용).
    # 실제 트리거는 cron-job.org → workflow_dispatch. GitHub native cron이
    # 혹시 뜨더라도 narrative 파일 중복 skip 로직으로 추가 비용 없음.
    - cron: "30 2 * * 6"
  workflow_dispatch:
    inputs:
      ticker:
        description: "단일 티커만 생성하려면 입력 (빈 값이면 전체)"
        required: false
        default: ""
      mode:
        description: "weekly / adhoc"
        required: false
        default: "weekly"

permissions:
  contents: write

concurrency:
  group: sma-narrative
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate narrative per ticker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set"
            exit 1
          fi

          MODE="${{ github.event.inputs.mode }}"
          [ -z "${MODE}" ] && MODE="weekly"
          SINGLE="${{ github.event.inputs.ticker }}"

          if [ -n "${SINGLE}" ]; then
            TICKERS="${SINGLE}"
          else
            TICKERS=$(grep -v '^#' tickers.txt | grep -v '^\s*$' | tr -d '\r' | xargs)
          fi
          echo "Narrating: ${TICKERS}  mode=${MODE}"

          for T in ${TICKERS}; do
            echo "=== Narrating ${T} ==="
            python3 narrative.py "${T}" --mode "${MODE}" --days 30 || echo "WARN: ${T} narrative failed"
          done

          python3 build_index.py

      # Narrative 파일을 artifact 로 업로드 (push 실패 시 수동 복구용, 7일 보관).
      # if: always() — 뒤에 Commit 단계가 실패해도 여기까진 반드시 실행.
      - name: Upload narratives as artifact (safety net)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narratives-${{ github.run_id }}
          path: |
            reports/tickers/*/narratives/*.html
            reports/index.html
            reports/tickers/*/index.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit narratives
        run: |
          git config user.name  "sma-bot"
          git config user.email "sma-bot@users.noreply.github.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No new narratives to commit"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "narratives: ${DATE} weekly [skip ci]"
          # daily 워크플로우와 동시 실행될 수 있어 push 경쟁 발생 → rebase-and-retry
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push success on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed, sleeping 10s…"
            sleep 10
          done
          echo "push failed after 5 attempts"
          exit 1

      - name: Notify Telegram
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          MODE="${{ github.event.inputs.mode }}"
          [ -z "${MODE}" ] && MODE="weekly"
          SINGLE="${{ github.event.inputs.ticker }}"

          if [ -n "${SINGLE}" ]; then
            TICKERS="${SINGLE}"
          else
            TICKERS=$(grep -v '^#' tickers.txt | grep -v '^\s*$' | tr -d '\r' | xargs)
          fi

          LINKS=""
          for T in ${TICKERS}; do
            LINKS="${LINKS}• <a href=\"https://analyzer.zbbg.kr/reports/tickers/${T}/\">${T}</a>"$'\n'
          done

          NL=$'\n'
          MSG="📝Weekly Narrative${NL}${DATE}${NL}${NL}${LINKS}${NL}<a href=\"https://analyzer.zbbg.kr/reports/\">Dashboard</a>"

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}" || echo "WARN: Telegram notify failed"
