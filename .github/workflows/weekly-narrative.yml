name: Weekly AI Narrative (notify)

# 주간 AI 내러티브는 Anthropic API 를 쓰지 않는다 (추가 과금 없음).
# 생성은 Claude Code 예약 작업(클라우드 세션, Claude Opus 5.5)이 매주 토요일 수행하고
# reports/tickers/*/narratives/ 를 main 에 푸시한다. 이 워크플로는 그 푸시를 감지해 텔레그램 알림만 보낸다.
# 수동 실행(workflow_dispatch) 시 가장 최근 세션의 내러티브 목록을 다시 알린다.
on:
  push:
    branches: [main]
    paths: ["reports/tickers/*/narratives/*.html"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sma-narrative-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Collect narratives
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "push" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            FILES="$(git diff --name-only --diff-filter=A "${BEFORE}" "${AFTER}" -- 'reports/tickers/*/narratives/*.html' || true)"
          else
            LATEST="$(ls reports/tickers/*/narratives/*.html 2>/dev/null | sed -E 's#.*/([0-9-]{10})-.*#\1#' | sort | tail -n1)"
            FILES="$(ls reports/tickers/*/narratives/${LATEST}-*.html 2>/dev/null || true)"
          fi
          FILES="$(printf '%s\n' "${FILES}" | grep -E '^reports/tickers/[A-Z0-9.^-]+/narratives/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z]+\.html$' || true)"
          if [ -z "${FILES}" ]; then
            echo "No newly added narrative pages — nothing to notify."
            echo "NOTIFY=0" >> "$GITHUB_ENV"
            exit 0
          fi
          SESSION="$(printf '%s\n' "${FILES}" | sed -E 's#.*/([0-9-]{10})-.*#\1#' | sort | tail -n1)"
          DONE="$(printf '%s\n' "${FILES}" | sed -E 's#reports/tickers/([^/]+)/.*#\1#' | sort -u | xargs)"
          WATCH="$(grep -v '^#' tickers.txt | tr -d '\r\t ' | grep -E '^[A-Z.-]{1,10}$' | xargs || true)"
          MISSING=""
          for T in ${WATCH}; do
            echo " ${DONE} " | grep -q " ${T} " || MISSING="${MISSING} ${T}"
          done
          {
            echo "NOTIFY=1"
            echo "SESSION=${SESSION}"
            echo "DONE=${DONE}"
            echo "MISSING=$(echo ${MISSING} | xargs)"
            echo "FILES=$(printf '%s ' ${FILES})"
          } >> "$GITHUB_ENV"
          {
            echo "### 💬 AI Narrative — 세션 ${SESSION}"
            echo "- 생성: ${DONE}"
            [ -n "${MISSING}" ] && echo "- 누락: ${MISSING}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Telegram
        if: env.NOTIFY == '1'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          NL=$'\n'
          LINKS=""
          for F in ${FILES}; do
            T="$(echo "${F}" | sed -E 's#reports/tickers/([^/]+)/.*#\1#')"
            LINKS="${LINKS}• <a href=\"https://analyzer.zbbg.kr/${F}\">${T}</a>${NL}"
          done
          MISS_BLOCK=""
          [ -n "${MISSING:-}" ] && MISS_BLOCK="${NL}⚠ 미생성: <b>${MISSING}</b>${NL}"
          MSG="💬 Weekly AI Narrative · 세션 ${SESSION} (Claude Opus 5.5)${NL}${NL}${LINKS}${MISS_BLOCK}${NL}📋 <a href=\"https://analyzer.zbbg.kr/reports/\">Dashboard</a>"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}" >/dev/null || echo "WARN: Telegram notify failed"
