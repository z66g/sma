name: Valuation Desk — research newly added tickers

# 관심종목(tickers.txt)이나 검토 종목(review.txt)이 바뀌면, 조사가 필요한 종목(리서치 없는 관심종목 · 분석 대기 검토 종목)이
# 있는지 확인하고 Claude 예약 작업(API 트리거)을 호출한다. 대시보드의 '적정가 분석 요청'·'재분석'도 review.txt 커밋으로 여기에 온다.
# 조사는 Claude 세션이 docs/VALUATION_ROUTINE.md 의 '수시 실행' 절차로 수행한다 (Anthropic API 과금 없음).
# 이 워크플로는 호출만 한다 — 저장소에 쓰지 않는다.
#
# 필요한 설정 (없으면 아무것도 하지 않고 안내만 남긴다):
#   Secrets  VALUATION_ROUTINE_FIRE_URL  예약 작업 편집 화면의 API 트리거 Fire URL (Variables 에 넣어도 된다)
#            VALUATION_ROUTINE_TOKEN     같은 화면에서 생성한 토큰 (한 번만 표시됨)
#   Variables (선택) VALUATION_ROUTINE_BETA  anthropic-beta 헤더 값이 바뀌면 덮어쓴다
on:
  push:
    branches: [main]
    paths: ["tickers.txt", "review.txt"]
  workflow_dispatch:
    inputs:
      connectivity_test:
        description: "연결 시험: 리서치 없는 종목이 없어도 예약 작업을 호출한다 (조사·발행 없이 저장소 접근과 계획만 확인)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# 연속으로 여러 종목을 추가하면 마지막 한 번만 호출한다 (대기 중이던 실행은 취소)
concurrency:
  group: valuation-on-add
  cancel-in-progress: true

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5

      - name: Tickers that need research (watchlist without research · pending review requests)
        id: new
        run: |
          set -euo pipefail
          NEW="$(python3 tools/valuation_pending.py)"
          if [ -n "${NEW}" ] && ! printf '%s\n' "${NEW}" | grep -Eq '^[A-Z][A-Z0-9.-]{0,9}( [A-Z][A-Z0-9.-]{0,9})*$'; then
            echo "::error::예상하지 못한 출력: ${NEW}"; exit 1
          fi
          echo "tickers=${NEW}" >> "$GITHUB_OUTPUT"
          if [ -z "${NEW}" ]; then
            echo "조사가 필요한 종목이 없습니다 — 호출하지 않습니다." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "조사가 필요한 종목: ${NEW}" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 종목을 연달아 추가하는 동안 기다렸다가 한 번만 호출한다 (그 사이 새 푸시가 오면 이 실행은 취소된다)
      - name: Debounce
        if: steps.new.outputs.tickers != '' && github.event_name == 'push'
        run: sleep 90

      - name: Fire the Valuation Desk routine
        if: steps.new.outputs.tickers != '' || inputs.connectivity_test
        env:
          # Fire URL 은 비밀값이 아니므로(토큰 없이는 호출 불가) Secrets 와 Variables 어느 쪽에 넣어도 읽는다
          FIRE_URL: ${{ secrets.VALUATION_ROUTINE_FIRE_URL || vars.VALUATION_ROUTINE_FIRE_URL }}
          TOKEN: ${{ secrets.VALUATION_ROUTINE_TOKEN }}
          HAS_URL_SECRET: ${{ secrets.VALUATION_ROUTINE_FIRE_URL != '' }}
          HAS_URL_VAR: ${{ vars.VALUATION_ROUTINE_FIRE_URL != '' }}
          HAS_TOKEN: ${{ secrets.VALUATION_ROUTINE_TOKEN != '' }}
          BETA: ${{ vars.VALUATION_ROUTINE_BETA }}
          TICKERS: ${{ steps.new.outputs.tickers }}
        run: |
          set -euo pipefail
          echo "설정 상태 — Fire URL: Secret=${HAS_URL_SECRET} · Variable=${HAS_URL_VAR} / 토큰: Secret=${HAS_TOKEN}" | tee -a "$GITHUB_STEP_SUMMARY"
          FIRE_URL="$(printf '%s' "${FIRE_URL:-}" | tr -d '[:space:]')"      # 붙여 넣을 때 섞인 공백·줄바꿈 제거
          if [ -z "${FIRE_URL:-}" ] || [ -z "${TOKEN:-}" ]; then
            echo "::notice::VALUATION_ROUTINE_FIRE_URL / VALUATION_ROUTINE_TOKEN 이 설정되지 않아 호출하지 않았습니다. 이 종목들은 다음 토요일 주간 작업에서 조사됩니다."
            echo "API 트리거 미설정 — 다음 토요일 주간 작업에서 조사됩니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "${FIRE_URL}" in
            https://api.anthropic.com/v1/claude_code/routines/*/fire) ;;
            *) echo "::error::VALUATION_ROUTINE_FIRE_URL 형식이 예상과 다릅니다"; exit 1 ;;
          esac
          if [ -n "${TICKERS}" ]; then
            NOTE="관심종목·검토 종목 변경 감지 — 조사가 필요한 종목(참고용, 실제 대상은 저장소의 tickers.txt · review.txt 와 valuation.py plan 으로 확인): ${TICKERS}"
          else
            NOTE="연결 시험 — 리서치가 없는 종목은 없음 (참고용)"
          fi
          BODY="$(jq -n --arg t "${NOTE}" '{text: $t}')"
          CODE="$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST "${FIRE_URL}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "anthropic-beta: ${BETA:-experimental-cc-routine-2026-04-01}" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            --data "${BODY}")"
          if [ "${CODE}" -ge 200 ] && [ "${CODE}" -lt 300 ]; then
            echo "호출 성공 (HTTP ${CODE}) — 대상: ${TICKERS:-없음(연결 시험)}" >> "$GITHUB_STEP_SUMMARY"
            echo "routine fired: HTTP ${CODE}"
          else
            echo "::error::예약 작업 호출 실패 (HTTP ${CODE})"
            jq -r '.error.message // .message // empty' /tmp/resp.json 2>/dev/null | head -c 300 || true
            exit 1
          fi
