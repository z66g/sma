name: Source Diagnostics

# 데이터 소스 가용성 점검 (수동 실행 + 개발 브랜치 push 시).
# 키/토큰 값은 절대 출력하지 않고 HTTP 상태·건수만 기록한다.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/source-diagnostics.yml", "tools/source_diagnostics.py"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probe sources
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python3 tools/source_diagnostics.py | tee -a "$GITHUB_STEP_SUMMARY"
