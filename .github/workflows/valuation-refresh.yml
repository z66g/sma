name: Valuation Desk Refresh

# 적정가치는 SMA 일일 수급 분석과 분리된 별도 기능이다.
# 이 워크플로는 '재계산'만 한다: 저장된 리서치 가정(state/valuation/research) + 최신 재무·주가 → reports/valuation/{T}.json 재발행.
# 리서치 작성(사업모델·성과·계획·뉴스 조사)은 예약된 Claude Code 세션이 docs/VALUATION_RESEARCH.md 지침으로 수행한다 (API 과금 없음).
# 일일 분석(daily-analysis.yml)은 발행된 수치를 읽기만 한다.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "재계산할 종목 (공백 구분, 빈 값이면 tickers.txt 전체)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sma-repo-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Regression tests (offline)
        run: python3 tools/test_valuation.py | tail -n 1
      - name: Recompute & publish
        env:
          INPUT_TICKERS: ${{ github.event.inputs.tickers }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -uo pipefail
          SEL="$(printf '%s' "${INPUT_TICKERS:-}" | tr '[:lower:]' '[:upper:]' | tr -s '[:space:]' ' ')"
          if [ -n "${SEL// /}" ]; then
            for T in ${SEL}; do [[ "${T}" =~ ^[A-Z.-]{1,10}$ ]] || { echo "::error::invalid ticker"; exit 1; }; done
            python3 valuation.py refresh ${SEL} | tee -a "$GITHUB_STEP_SUMMARY" || echo "::warning::some tickers failed"
          else
            python3 valuation.py refresh --watchlist | tee -a "$GITHUB_STEP_SUMMARY" || echo "::warning::some tickers failed"
          fi
          { echo ''; echo '```'; python3 valuation.py status; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          set -uo pipefail
          git config user.name  "sma-bot"
          git config user.email "sma-bot@users.noreply.github.com"
          git add reports/valuation state/fundamentals state/valuation 2>/dev/null || true
          git add reports/tickers/*/valuation.html 2>/dev/null || true
          if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "valuation: refresh published fair values [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            if git rebase -q -X theirs origin/main && git push -q origin HEAD:main; then echo "pushed (attempt $i)"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::push failed"; exit 1
